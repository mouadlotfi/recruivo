name: recruivo

x-laravel-service: &laravel-service
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  image: ${APP_IMAGE:-ghcr.io/mouadlotfi/recruivo:${APP_TAG:-production}}
  init: true
  restart: unless-stopped
  working_dir: /var/www/html
  env_file:
    - ${APP_ENV_FILE:-.env.docker}
  environment:
    DB_HOST: mysql
    REDIS_HOST: redis
  volumes:
    - ./storage:/var/www/html/storage
  networks:
    - private
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: ${NGINX_IMAGE:-ghcr.io/mouadlotfi/recruivo-nginx:${APP_TAG:-production}}
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    networks:
      - public
      - private
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  app:
    <<: *laravel-service
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-recruivo_db}
      MYSQL_USER: ${DB_USERNAME:-recruivo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-secret}}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./data/redis:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    <<: *laravel-service
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=${QUEUE_WORKER_TIMEOUT:-60}", "--no-interaction"]

  scheduler:
    <<: *laravel-service
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

  bootstrap:
    <<: *laravel-service
    profiles: ["production", "demo"]
    command: ["sh", "-c", "php artisan config:cache && php artisan view:cache"]
    restart: "no"
    volumes:
      - ./storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

volumes:
  mysql_data:
    external: true
    name: ${MYSQL_VOLUME_NAME:-recruivo_mysql_august_verified}
  bootstrap_cache:

networks:
  public:
    name: ${COMPOSE_PROJECT_NAME:-recruivo}_public
  private:
    name: ${COMPOSE_PROJECT_NAME:-recruivo}_private
    internal: true
