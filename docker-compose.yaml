name: recruivo

x-laravel-service: &laravel-service
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  image: ${APP_IMAGE:-ghcr.io/mouadlotfi/recruivo}:${APP_TAG:-production}
  init: true
  restart: unless-stopped
  working_dir: /var/www/html
  environment:
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_IS_DEMO: ${APP_IS_DEMO:-false}
    APP_KEY: ${APP_KEY}
    APP_URL: ${APP_URL:-https://recruivo.work}
    DB_CONNECTION: ${DB_CONNECTION:-mysql}
    DB_HOST: mysql
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:-recruivo_db}
    DB_USERNAME: ${DB_USERNAME:-recruivo}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    CACHE_DRIVER: ${CACHE_DRIVER:-redis}
    FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    REDIS_HOST: redis
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_DB: ${REDIS_DB:-0}
    REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@recruivo.work}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Recruivo}
    SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-recruivo.work}
    FRONTEND_URLS: ${FRONTEND_URLS:-https://recruivo.work}
    QUEUE_FAILED_DRIVER: ${QUEUE_FAILED_DRIVER:-database-uuids}
    DEMO_SCHEDULED_RESET: ${DEMO_SCHEDULED_RESET:-false}
  volumes:
    - app_storage:/var/www/html/storage
  networks:
    - private
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: ${NGINX_IMAGE:-ghcr.io/mouadlotfi/recruivo-nginx}:${APP_TAG:-production}
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    networks:
      - public
      - private
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  app:
    <<: *laravel-service
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-recruivo_db}
      MYSQL_USER: ${DB_USERNAME:-recruivo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-secret}}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    <<: *laravel-service
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=${QUEUE_WORKER_TIMEOUT:-60}", "--no-interaction"]

  scheduler:
    <<: *laravel-service
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-recruivo_mysql_august_verified}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-recruivo_redis_data}
  app_storage:
    name: ${STORAGE_VOLUME_NAME:-recruivo_storage}

networks:
  public:
    name: ${COMPOSE_PROJECT_NAME:-recruivo}_public
  private:
    name: ${COMPOSE_PROJECT_NAME:-recruivo}_private
    internal: true
