# Local development compose overlay.
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Every Laravel service (app, queue, scheduler, migrate) must build the local
# `development` target: the base file points them at the private GHCR image,
# which cannot be pulled without registry credentials.

x-laravel-service-dev: &laravel-service-dev
  image: ${APP_IMAGE:-recruivo:development}
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  volumes:
    - .:/var/www/html
    - vendor_data:/var/www/html/vendor
    - app_storage:/var/www/html/storage

services:
  app:
    <<: *laravel-service-dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  queue:
    <<: *laravel-service-dev

  scheduler:
    <<: *laravel-service-dev

  # Runs migrations against the working tree, not a published image.
  migrate:
    <<: *laravel-service-dev

  mysql:
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"

  redis:
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"

  vite:
    image: node:22-bookworm-slim
    init: true
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/vite ]; then npm ci --prefer-offline --no-audit; fi; exec npm run dev -- --host 0.0.0.0"]
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"

volumes:
  vendor_data:
  node_modules:
