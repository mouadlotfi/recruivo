name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/recruivo

jobs:
  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, zip, gd, redis
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create storage and build directories
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views,testing} storage/logs bootstrap/cache public/build
          echo '{"resources/js/app.ts":{"file":"assets/app.js","isEntry":true,"src":"resources/js/app.ts"},"resources/css/app.css":{"file":"assets/app.css","src":"resources/css/app.css"}}' > public/build/manifest.json

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Run tests (PHPUnit)
        run: php artisan test --compact
        env:
          APP_ENV: testing
          APP_KEY: base64:7f9E2k8nZ3vB5cX7mA9pQ1wE3rT5yU7iO9pA1sD3fG5=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  docker-build-check:
    name: Docker build check (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha,scope=app

  build-images:
    name: Build and push (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  deploy-production:
    name: Deploy Production
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      app-uuid: ${{ vars.COOLIFY_PRODUCTION_APP_UUID || '3ioftpjgpbfag6p5uzoahwlw' }}
      app-tag: sha-${{ github.sha }}
      coolify-host: ${{ vars.COOLIFY_HOST || 'http://100.100.217.81:8000' }}
      health-url: https://recruivo.work/api/health,http://100.100.217.81:8085/api/health
      environment-name: production
      environment-url: https://recruivo.work
    secrets:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK || secrets.COOLIFY_WEBHOOK }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}

  deploy-demo:
    name: Deploy Demo
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      app-uuid: ${{ vars.COOLIFY_DEMO_APP_UUID || 'g2g8akaxgwhgaitmfp9mwepd' }}
      app-tag: sha-${{ github.sha }}
      coolify-host: ${{ vars.COOLIFY_HOST || 'http://100.100.217.81:8000' }}
      health-url: https://demo.recruivo.work/api/health,http://100.100.217.81:8086/api/health
      data-endpoint: https://demo.recruivo.work/api/jobs
      environment-name: demo
      environment-url: https://demo.recruivo.work
    secrets:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEMO_WEBHOOK }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
