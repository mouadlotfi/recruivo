name: Deploy to Coolify

on:
  workflow_call:
    inputs:
      app-uuid:
        description: Coolify application UUID
        required: true
        type: string
      app-tag:
        description: Application image tag
        required: true
        type: string
      coolify-host:
        description: Coolify API host URL
        required: true
        type: string
      health-url:
        description: Comma-separated list of URLs to verify application health
        required: true
        type: string
      environment-name:
        description: GitHub environment name
        required: false
        default: production
        type: string
      environment-url:
        description: GitHub environment URL
        required: true
        type: string
    secrets:
      COOLIFY_TOKEN:
        description: Coolify API Bearer token
        required: true
      COOLIFY_WEBHOOK:
        description: Coolify deploy webhook URL
        required: true
      TS_OAUTH_CLIENT_ID:
        description: Tailscale OAuth Client ID
        required: true
      TS_AUDIENCE:
        description: Tailscale OIDC Audience
        required: true

jobs:
  deploy:
    name: Deploy (${{ inputs.environment-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Connect to Tailscale (WIF)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.100.217.81
          use-cache: false

      - name: Verify Coolify connectivity
        env:
          COOLIFY_HOST: ${{ inputs.coolify-host }}
        run: curl --fail --silent --max-time 10 "${COOLIFY_HOST}"

      - name: Point Coolify APP_TAG at this commit
        env:
          COOLIFY_HOST: ${{ inputs.coolify-host }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ inputs.app-uuid }}
          APP_TAG: ${{ inputs.app-tag }}
        run: |
          set -euo pipefail
          for PREVIEW in false true; do
            HTTP_CODE=$(curl --silent --show-error --write-out "%{http_code}" --output /tmp/coolify_env_resp.json \
              -X PATCH \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"APP_TAG\",\"value\":\"${APP_TAG}\",\"is_preview\":${PREVIEW}}" \
              "${COOLIFY_HOST}/api/v1/applications/${APP_UUID}/envs")

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Coolify API returned HTTP ${HTTP_CODE} when updating APP_TAG (is_preview=${PREVIEW})"
              exit 1
            fi
          done

      - name: Trigger and verify Coolify deployment
        id: deploy
        env:
          COOLIFY_HOST: ${{ inputs.coolify-host }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail --silent --show-error \
            -X POST "${COOLIFY_WEBHOOK}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          DEPLOYMENT_UUID=$(echo "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // empty')

          if [ -z "${DEPLOYMENT_UUID:-}" ] || [ "${DEPLOYMENT_UUID}" = "null" ]; then
            echo "::error::Could not extract deployment_uuid from Coolify response: $RESPONSE"
            exit 1
          fi

          echo "deployment_uuid=${DEPLOYMENT_UUID}" >> "$GITHUB_OUTPUT"
          echo "Coolify deployment queued: ${DEPLOYMENT_UUID}"

          TIMEOUT_SECONDS=600
          POLL_INTERVAL=3
          ELAPSED=0

          while true; do
            DEPLOY_INFO=$(curl --silent --show-error \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_HOST}/api/v1/deployments/${DEPLOYMENT_UUID}" 2>/dev/null || echo "{}")

            STATUS=$(echo "$DEPLOY_INFO" | jq -r '.status // empty' 2>/dev/null | tr '[:upper:]' '[:lower:]' || echo "")
            echo "Deployment status: ${STATUS:-polling} (${ELAPSED}s elapsed)"

            case "$STATUS" in
              finished)
                echo "Coolify deployment ${DEPLOYMENT_UUID} finished successfully."
                break
                ;;
              failed|cancelled|canceled)
                echo "::error::Coolify deployment ${DEPLOYMENT_UUID} failed with status: ${STATUS}"
                exit 1
                ;;
              queued|in_progress|"")
                ;;
            *)
              echo "::warning::Unrecognized status '${STATUS}', continuing to poll..."
              ;;
          esac

          if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
            echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for deployment ${DEPLOYMENT_UUID}"
            exit 1
          fi

          sleep "$POLL_INTERVAL"
          ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Verify application health
        env:
          HEALTH_URL: ${{ inputs.health-url }}
          ENV_NAME: ${{ inputs.environment-name }}
          ENV_URL: ${{ inputs.environment-url }}
          APP_TAG: ${{ inputs.app-tag }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          echo "Verifying application health for ${ENV_NAME}..."
          STATUS=""
          for ATTEMPT in {1..15}; do
            for URL in $(echo "$HEALTH_URL" | tr ',' ' '); do
              RESPONSE=$(curl --silent --show-error --max-time 10 "$URL" 2>/dev/null || true)
              STATUS=$(echo "$RESPONSE" | jq -r '.status // empty' 2>/dev/null || echo "")
              if [ "$STATUS" = "healthy" ]; then
                echo "Health check succeeded on ${URL}: ${RESPONSE}"
                break 2
              fi
            done
            echo "Health check attempt ${ATTEMPT}/15: status=${STATUS:-unreachable}, retrying in 5s..."
            sleep 5
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "::error::Health check failed across all endpoints: ${HEALTH_URL}"
            exit 1
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Deployment Successful: ${ENV_NAME}

          | Metric | Value |
          |---|---|
          | **Application** | [${ENV_URL}](${ENV_URL}) |
          | **Health Check** | [${HEALTH_URL%%,*}](${HEALTH_URL%%,*}) ✅ \`healthy\` |
          | **Image Tag** | \`${APP_TAG}\` |
          | **Deployment UUID** | \`${DEPLOYMENT_UUID}\` |
          EOF
