services:
  app:
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  queue:
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - ./storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  scheduler:
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - ./storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  bootstrap:
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
